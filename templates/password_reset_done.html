<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parolni tiklash</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #0a1128 0%, #16213e 50%, #0f3460 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .login-box {
    background-color: #111c3f;
    border: 1px solid #223163;
    border-radius: 10px;
    padding: 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    position: relative;
    text-align: center;
  }

  .back-button {
    position: absolute;
    top: 16px;
    left: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background-color: rgba(255, 255, 255, 0.1);
    color: #e8ecf7;
    text-decoration: none;
    transition: background-color 0.2s ease, transform 0.2s ease;
  }

  .back-button:hover {
    background-color: rgba(255, 255, 255, 0.15);
    transform: scale(1.05);
  }

  h1 {
    color: #e8ecf7;
    font-size: 20px;
    margin: 20px 0 12px;
  }

  p {
    color: #a9b4d6;
    font-size: 14px;
    line-height: 1.5;
    margin: 8px 0;
  }

  .resend-btn {
    display: inline-block;
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    background-color: #2563eb;
    border: none;
    border-radius: 6px;
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: background-color 0.2s ease;
  }

  .resend-btn:hover {
    background-color: #1d4ed8;
  }
</style>
</head>
<body>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <div class="login-box">
    <a href="/login/" class="back-button" title="Kirish sahifasiga qaytish">
      <span class="material-icons">chevron_left</span>
    </a>

    <h1>Parolni tiklash havolasi yuborildi</h1>
    
    <p>Agar siz ko'rsatgan e-mail manzil bo'yicha akkaunt mavjud bo'lsa, xat yuborildi.</p>
    <p style="color: #7c88b8; font-size: 13px;">Pochtangizning <b>"Spam"</b> papkasini ham tekshirib ko'ring.</p>

    <!-- Qayta yuborish sahifasiga yo'naltirish -->
    <a href="/password-reset/" class="resend-btn">Qayta yuborish</a>
  </div>
</body>
</html>
