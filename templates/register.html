<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ro'yxatdan o'tish</title>

<!-- Google Material Icons -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #0a1128;
    background: linear-gradient(160deg, #0a1128 0%, #16213e 50%, #0f3460 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .login-box {
    background-color: #111c3f;
    border: 1px solid #223163;
    border-radius: 10px;
    padding: 40px 36px;
    width: 100%;
    max-width: 450px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  }

  h1 {
    color: #e8ecf7;
    font-size: 22px;
    margin: 0 0 20px;
    text-align: center;
  }

  label {
    display: block;
    color: #a9b4d6;
    font-size: 13px;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 11px 12px;
    margin-bottom: 18px;
    background-color: #0c1533;
    border: 1px solid #29366b;
    border-radius: 6px;
    color: #e8ecf7;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s ease;
  }

  input:focus {
    border-color: #3b82f6;
  }

  input::placeholder {
    color: #55608c;
  }

  /* Parol va ko'zcha ikonkasi uchun o'rovchi konteyner */
  .input-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    margin-bottom: 18px;
  }

  .input-wrapper input {
    margin-bottom: 0; /* Wrapper ichidagi input marjinini o'chirish */
    padding-right: 40px; /* Ko'zcha ikonkasi uchun o'ngdan joy ajratish */
  }

  /* Ko'zcha (Visibility) ikonkasi stili */
  .toggle-password {
    position: absolute;
    right: 12px;
    color: #7c88b8;
    font-size: 20px;
    cursor: pointer;
    user-select: none;
    transition: color 0.2s ease;
  }

  .toggle-password:hover {
    color: #6ea8fe;
  }

  button {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    background-color: #2563eb;
    border: none;
    border-radius: 6px;
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.2s ease;
  }

  button:hover {
    background-color: #1d4ed8;
  }

  a {
    color: #6ea8fe;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

  <form method="post" action="" class="login-box">
    {% csrf_token %}
    
    <h1>Ro'yxatdan o'tish</h1>

    <!-- Ism va Familiya yonma-yon -->
    <div style="display: flex; flex-direction: row; gap: 10px; width: 100%;">
      <div style="display: flex; flex-direction: column; width: 100%;">
        <label for="first_name">Ism:</label>
        <input type="text" id="first_name" name="first_name" placeholder="John">
      </div>
      <div style="display: flex; flex-direction: column; width: 100%;">
        <label for="last_name">Familiya:</label>
        <input type="text" id="last_name" name="last_name" placeholder="Doe">
      </div>
    </div>

    <label for="email">E-mail manzil:</label>
    <input type="email" id="email" name="email" placeholder="johndoe@example.com">

    <label for="username"> <span style="color: red;">*</span> Username:</label>
    <input type="text" id="username" name="username" placeholder="johndoe" required>

    <!-- Parol inputi -->
    <label for="password1"> <span style="color: red;">*</span> Parol:</label>
    <div class="input-wrapper">
      <input type="password" id="password1" name="password1" placeholder="********" required>
      <span class="material-icons toggle-password" onclick="toggleVisibility('password1', this)">visibility</span>
    </div>

    <!-- Parolni tasdiqlash inputi -->
    <label for="password2"> <span style="color: red;">*</span> Parolni tasdiqlang:</label>
    <div class="input-wrapper">
      <input type="password" id="password2" name="password2" placeholder="********" required>
      <span class="material-icons toggle-password" onclick="toggleVisibility('password2', this)">visibility</span>
    </div>

    <!-- Xatoliklar uchun -->
    {% if error_messages %}
      <div style="margin: 10px 0;">
        {% for error_message in error_messages %}
          <small style="color: #ef4444; font-weight: 600; display: block;">{{ error_message }}</small>
        {% endfor %}
      </div>
    {% endif %}

    <button type="submit">Ro'yxatdan o'tish</button>
    
    <div style="display: flex; flex-direction: row; gap: 5px; margin-top: 14px; font-size: 13px; justify-content: center;">
      <span style="color: #a9b4d6;">Akkauntingiz bormi?</span>
      <a href="/login/">Kirish</a>
    </div>
  </form>

  <!-- JavaScript: Parolni ko'rsatish/yashirish mantiqi -->
  <script>
    function toggleVisibility(inputId, iconElement) {
      const input = document.getElementById(inputId);

      if (input.type === 'password') {
        input.type = 'text';
        iconElement.textContent = 'visibility_off'; // Chizilgan ko'zcha
      } else {
        input.type = 'password';
        iconElement.textContent = 'visibility'; // Oddiy ko'zcha
      }
    }
  </script>

</body>
</html>
