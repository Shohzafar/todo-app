<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yangi parolni o'rnatish</title>

  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <!-- Google Fonts: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 20px;
    }

    .login-box {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
    }

    .login-box h1 {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      text-align: center;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .login-box label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: #475569;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    /* Chap tomondagi kalit ikonkasi */
    .input-wrapper .input-icon {
      position: absolute;
      left: 14px;
      color: #94a3b8;
      font-size: 20px;
      pointer-events: none;
    }

    /* O'ng tomondagi ko'zcha (visibility) ikonkasi */
    .input-wrapper .toggle-password {
      position: absolute;
      right: 14px;
      color: #94a3b8;
      font-size: 20px;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s ease;
    }

    .input-wrapper .toggle-password:hover {
      color: #6366f1;
    }

    .login-box input[type="password"],
    .login-box input[type="text"] {
      width: 100%;
      /* O'ng va chap tomondan ikonka uchun joy ajratilgan (44px) */
      padding: 12px 44px 12px 44px;
      font-size: 15px;
      color: #0f172a;
      background-color: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      outline: none;
      transition: all 0.2s ease;
    }

    .login-box input:focus {
      background-color: #ffffff;
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
    }

    .login-box button[type="submit"] {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
      transition: all 0.2s ease;
    }

    .login-box button[type="submit"]:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
    }

    .login-box button[type="submit"]:active {
      transform: translateY(0);
    }

    /* Havola yaroqsiz bo'lgandagi xabar stili */
    .invalid-link-card {
      text-align: center;
      padding: 10px 0;
    }

    .invalid-link-card .material-icons {
      font-size: 56px;
      color: #ef4444;
      margin-bottom: 16px;
    }

    .invalid-link-card p {
      color: #64748b;
      font-size: 15px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="login-box">
    {% if validlink %}
      <form action="" method="post">
        {% csrf_token %}
        <h1>Yangi parolni o'rnatish</h1>

        <!-- 1-Parol inputi -->
        <div class="form-group">
          <label for="new-password1">Yangi parol:</label>
          <div class="input-wrapper">
            <span class="material-icons input-icon">lock</span>
            <input type="password" name="new-password1" id="new-password1" placeholder="••••••••" required />
            <span class="material-icons toggle-password" onclick="toggleVisibility('new-password1', this)">visibility</span>
          </div>
        </div>

        <!-- 2-Parol tasdig'i inputi -->
        <div class="form-group">
          <label for="new-password2">Parolni tasdiqlang:</label>
          <div class="input-wrapper">
            <span class="material-icons input-icon">lock_reset</span>
            <input type="password" name="new-password2" id="new-password2" placeholder="••••••••" required />
            <span class="material-icons toggle-password" onclick="toggleVisibility('new-password2', this)">visibility</span>
          </div>
        </div>

        <button type="submit">Parolni tiklash</button>
      </form>
    {% else %}
      <div class="invalid-link-card">
        <span class="material-icons">error_outline</span>
        <p>Parolni tiklash havolasi yaroqsiz yoki undan allaqachon foydalanilgan.</p>
      </div>
    {% endif %}
  </div>

  <!-- JavaScript: Parolni ko'rsatish/yashirish mantiqi -->
  <script>
    function toggleVisibility(inputId, iconElement) {
      const input = document.getElementById(inputId);

      if (input.type === 'password') {
        input.type = 'text';
        iconElement.textContent = 'visibility_off'; // Ko'z ustiga chizilgan ikonka
      } else {
        input.type = 'password';
        iconElement.textContent = 'visibility'; // Oddiy ko'z ikonka
      }
    }
  </script>

</body>
</html>
